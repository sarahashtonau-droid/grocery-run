<style>
:root{
  --paper:#F5F6F0;
  --paper-raised:#FFFFFF;
  --ink:#20281F;
  --ink-soft:#5D6659;
  --line:#DAD6C6;
  --aldi:#1B4CA6;
  --aldi-soft:#E7EDF9;
  --wool:#177A34;
  --wool-soft:#E6F3E9;
  --staple:#8A6A34;
  --staple-soft:#F1E9D8;
  --danger:#A6432B;
  --danger-soft:#F5E6E1;
  --radius:10px;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1F19;
    --paper-raised:#242923;
    --ink:#E8E7DD;
    --ink-soft:#A5AA9C;
    --line:#3A3F34;
    --aldi:#7FA3E8;
    --aldi-soft:#243050;
    --wool:#6FCB8C;
    --wool-soft:#1E3624;
    --staple:#D3B171;
    --staple-soft:#3A311F;
    --danger:#E28468;
    --danger-soft:#432720;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1F19;
  --paper-raised:#242923;
  --ink:#E8E7DD;
  --ink-soft:#A5AA9C;
  --line:#3A3F34;
  --aldi:#7FA3E8;
  --aldi-soft:#243050;
  --wool:#6FCB8C;
  --wool-soft:#1E3624;
  --staple:#D3B171;
  --staple-soft:#3A311F;
  --danger:#E28468;
  --danger-soft:#432720;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px;}
.topbar h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:28px;
  margin:0 0 2px;
  letter-spacing:-0.01em;
}
.topbar p{margin:0 0 18px;color:var(--ink-soft);font-size:13px;max-width:52ch;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.tab{
  appearance:none;border:none;background:none;font-family:var(--font-body);
  font-size:13px;color:var(--ink-soft);padding:9px 4px;margin-right:18px;
  cursor:pointer;border-bottom:2px solid transparent;transform:translateY(1px);
}
.tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:600;}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
textarea,input[type=text],select{
  width:100%;font-family:var(--font-body);font-size:13.5px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;
}
textarea{min-height:84px;resize:vertical;}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.row > *{flex:1 1 auto;min-width:70px;}
.btn{
  appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-family:var(--font-body);font-size:13px;font-weight:600;padding:9px 14px;
  border-radius:8px;cursor:pointer;white-space:nowrap;
}
.btn:hover{opacity:0.88;}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;}
.btn.small{padding:5px 10px;font-size:12px;}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn.aldi{background:var(--aldi);border-color:var(--aldi);}
.btn.wool{background:var(--wool);border-color:var(--wool);}
.checklist{display:flex;flex-direction:column;gap:6px;}
.checklist label{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;}
.muted{color:var(--ink-soft);font-size:12.5px;}
.badge{
  display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:100px;
  border:1px solid var(--line);color:var(--ink-soft);margin-left:6px;
}
.badge.gf{color:var(--wool);border-color:var(--wool);}
.warning-box{
  background:var(--danger-soft);border:1px solid var(--danger);color:var(--ink);
  border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;
}
.warning-box ul{margin:6px 0 0;padding-left:18px;}
.recipe-row{border-bottom:1px solid var(--line);padding:12px 0;}
.recipe-row:last-child{border-bottom:none;}
.recipe-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
.recipe-name{font-family:var(--font-display);font-size:16px;font-weight:600;}
.recipe-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.ing-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.ing-row{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;}
.ing-name{flex:1 1 auto;min-width:120px;}
.ing-controls{display:flex;gap:6px;}
.ing-controls button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:2px 4px;}
.ing-controls button:hover{color:var(--ink);}
.def-selects{display:flex;gap:4px;}
.def-selects select{width:auto;font-size:11.5px;padding:4px 6px;}
.add-ing-form{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.add-ing-form input{width:auto;flex:1 1 70px;}
.paste-box{margin-top:10px;}
.store-tabs{display:flex;gap:8px;margin-bottom:14px;}
.store-tab{
  flex:1;text-align:center;padding:10px;border-radius:8px;border:1px solid var(--line);
  cursor:pointer;font-weight:600;font-size:13.5px;background:var(--paper-raised);
}
.store-tab.aldi.active{background:var(--aldi-soft);border-color:var(--aldi);color:var(--aldi);}
.store-tab.wool.active{background:var(--wool-soft);border-color:var(--wool);color:var(--wool);}
.aisle-title{
  font-family:var(--font-display);font-size:13px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.04em;color:var(--ink-soft);margin:16px 0 6px;
}
.aisle-title:first-child{margin-top:0;}
.item-row-wrap{position:relative;overflow:hidden;}
.item-row-delete-bg{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
.item-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);position:relative;background:var(--paper-raised);touch-action:pan-y;-webkit-user-select:none;user-select:none;}
.item-row-content{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 8px;flex:1 1 auto;min-width:0;}
.item-row:last-child{border-bottom:none;}
.item-row input[type=checkbox]{width:17px;height:17px;flex:none;margin-top:2px;}
.item-row .item-name{flex:1 1 140px;font-size:14px;min-width:0;white-space:normal;word-break:break-word;line-height:1.35;padding-top:1px;}
.item-row.checked .item-name{text-decoration:line-through;color:var(--ink-soft);}
.item-row .item-qty{color:var(--ink-soft);font-size:12px;flex:none;}
.item-row select{width:auto;font-size:11px;padding:4px 6px;flex:none;}
.item-row .aisle-edit-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:2px 4px;flex:none;}
.item-row .move-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:11px;text-decoration:underline;flex:none;white-space:nowrap;}
.unsorted-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line);}
.unsorted-row .item-name{flex:1 1 140px;font-size:13.5px;}
.empty-state{color:var(--ink-soft);font-size:13px;padding:10px 0;}
.week-meta-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.staple-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:6px 0;border-bottom:1px dashed var(--line);}
.staple-row:last-child{border-bottom:none;}
.staple-name{flex:1 1 auto;font-size:13.5px;}
.progress-note{font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
</style>
</head>

  if(/onion|carrot|potato|tomato|lettuce|capsicum|garlic|broccoli|apple|banana|lemon|lime|herb|coriander|parsley|spinach|zucchini|mushroom|avocado|cucumber/.test(n)) return 'Produce';
  if(/toilet|paper towel|detergent|dishwash|laundry|foil|cling wrap|bin bag|tissue/.test(n)) return 'Household';
  return 'Pantry';
}

function parseIngredientLine(raw){
  let line = (raw||'').trim();
  line = line.replace(/^[-*\u2022]\s*/, '');
  if(!line) return null;
  const m = line.match(/^(\d+(?:[\/.]\d+)?(?:\s*-\s*\d+)?)\s*(g|kg|ml|l|litre|litres|tsp|teaspoon|teaspoons|tbsp|tablespoon|tablespoons|cup|cups|oz|lb|lbs|clove|cloves|can|cans|pinch|pinches|slice|slices|bunch|bunches|packet|packets|pkt)?\s+(.*)$/i);
  if(m){ return {qty:m[1], unit:(m[2]||'').toLowerCase(), name:m[3].trim()}; }
  return {qty:'', unit:'', name:line};
}

// Thin adapter so the rest of the app can keep using db.doc()/db.collection() exactly as
// it did against Claude's storage \u2014 only this adapter changes underneath it.
function makeFirestoreDb(){
  function mkDoc(path){
    const ref = firestore.doc(path);
    return {
      async get(){ const snap = await ref.get(); return { id: snap.id, exists: snap.exists, data: () => snap.data() }; },
      async set(data){ await ref.set(data); },
      async update(data){ await ref.update(data); },
      // Change ONE nested field (e.g. shoppingChecked -> key) without rewriting the whole document,
      // so two phones ticking different items at the same moment don't overwrite each other.
      async updateField(fieldPath, value){ await ref.update(new firebase.firestore.FieldPath(...fieldPath), value); },
      async delete(){ await ref.delete(); },
      // Live updates. Skips the echo of our own not-yet-confirmed writes; fires for changes from other devices.
      onSnapshot(cb){
        return ref.onSnapshot({includeMetadataChanges:true}, snap=>{
          if(snap.metadata.hasPendingWrites) return;
          cb({ id: snap.id, exists: snap.exists, data: () => snap.data() });
        }, err=>{ console.warn('live sync (doc) stopped', path, err && err.code); });
      },
      collection(sub){ return mkCollection(path+'/'+sub); }
    };
  }
  function mkCollection(path){
    const ref = firestore.collection(path);
    return {
      doc(id){ return mkDoc(path+'/'+(id||ref.doc().id)); },
      async get(){
        const snap = await ref.get();
        return { docs: snap.docs.map(d=>({ id:d.id, exists:true, data:()=>d.data() })) };
      },
      onSnapshot(cb){
        return ref.onSnapshot({includeMetadataChanges:true}, snap=>{
          if(snap.metadata.hasPendingWrites) return;
          cb({ docs: snap.docs.map(d=>({ id:d.id, exists:true, data:()=>d.data() })) });
        }, err=>{ console.warn('live sync (collection) stopped', path, err && err.code); });
      }
    };
  }
  return { doc:(p)=>mkDoc(p), collection:(p)=>mkCollection(p) };
}

// In-memory stand-in for makeFirestoreDb(), used only in local preview mode (no Firebase reachable).
function makeLocalDb(){
  const store = {};
  function mkDoc(path){
    return {
      async get(){ const data = store[path]; return { id: path.split('/').pop(), exists: data !== undefined, data: () => data }; },
      async set(data){ store[path] = data; },
      async update(data){ store[path] = {...(store[path]||{}), ...data}; },
      async updateField(fieldPath, value){
        let o = (store[path] = store[path] || {});
        for(let i=0;i<fieldPath.length-1;i++){ o = (o[fieldPath[i]] = o[fieldPath[i]] || {}); }
        o[fieldPath[fieldPath.length-1]] = value;
      },
      async delete(){ delete store[path]; },
      collection(sub){ return mkCollection(path+'/'+sub); }
    };
  }
  function mkCollection(path){
    return {
      doc(id){ return mkDoc(path+'/'+(id||Math.random().toString(36).slice(2))); },
      async get(){
        const prefix = path+'/';
        const docs = Object.keys(store).filter(k=>k.startsWith(prefix) && k.slice(prefix.length).indexOf('/')===-1)
          .map(k=>({ id: k.slice(prefix.length), exists:true, data:()=>store[k] }));
        return { docs };
      }
    };
  }
  return { doc:(p)=>mkDoc(p), collection:(p)=>mkCollection(p) };
}

let remoteRenderTimer = null;

// Key-order-insensitive comparison, so Firestore returning fields in a different order doesn't look like a change.
function stableStringify(v){
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stableStringify).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
}

// Don't redraw the page under someone who's typing in a box or mid-swipe \u2014 wait until they're done.
function isBusy(){
  const ae = document.activeElement;
  const typing = ae && ((ae.tagName==='INPUT' && ae.type!=='checkbox' && ae.type!=='button') || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT');
  return !!typing || !!(swipeState && swipeState.dragging);
}

function remoteRender(){
  clearTimeout(remoteRenderTimer);
  if(isBusy()){
    remoteRenderPending = true;
    remoteRenderTimer = setTimeout(()=>{ if(remoteRenderPending) remoteRender(); }, 700);
    return;
  }
  render();
}

function startLiveSync(){
  if(!firebaseAvailable || liveStarted || !db) return;
  try{
    liveStarted = true;
    const watch = unsub => { if(typeof unsub==='function') liveUnsubs.push(unsub); };

    watch(db.collection('recipes').onSnapshot(snap=>{
      const incoming = {};
      snap.docs.forEach(d=>{ incoming[d.id] = clone(d.data()); });
      if(stableStringify(incoming) === stableStringify(state.recipes)) return;
      state.recipes = incoming; remoteRender();
    }));

    watch(db.doc('staples/master').onSnapshot(snap=>{
      const incoming = snap.exists ? clone(snap.data().items||[]) : [];
      if(stableStringify(incoming) === stableStringify(state.staples)) return;
      state.staples = incoming; remoteRender();
    }));

    watch(db.doc('defaults/items').onSnapshot(snap=>{
      const incoming = snap.exists ? clone(snap.data().map||{}) : {};
      if(stableStringify(incoming) === stableStringify(state.defaults)) return;
      state.defaults = incoming; remoteRender();
    }));

    watch(db.doc('week/current').onSnapshot(snap=>{
      const incoming = snap.exists ? clone(snap.data()) : null;
      if(stableStringify(incoming) === stableStringify(state.week)) return;
      state.week = incoming; remoteRender();
    }));
  }catch(e){
    // Live updating is a bonus \u2014 if it can't start, the app carries on exactly as before (refresh to see changes).
    console.warn('live sync not started', e);
  }
}

function stopLiveSync(){
  liveUnsubs.forEach(u=>{ try{ u(); }catch(e){} });
  liveUnsubs = []; liveStarted = false;
}

// ---------- computing this week's lists ----------
function foldApostrophes(s){ return (s||'').replace(/[\u2018\u2019\u02BC\u02BB\u00B4\u0060]/g, "'"); }

// ---------- Pull this week's dinners from the family Google Calendar ----------
// The Friday menu-plan automation books "🍽️ Dinner: <recipe>" events Mon–Thu on the family calendar.
// This reads them back using a short-lived Calendar read-only token from the signed-in Google account.
const FAMILY_CALENDAR_ID = 'family14985769838571664194@group.calendar.google.com';
const CAL_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
let calToken = null, calTokenExpires = 0;
async function getCalendarToken(){
  if(calToken && Date.now() < calTokenExpires) return calToken;
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope(CAL_SCOPE);
  if(auth.currentUser && auth.currentUser.email) provider.setCustomParameters({login_hint: auth.currentUser.email});
  const result = await auth.currentUser.reauthenticateWithPopup(provider);
  calToken = result.credential && result.credential.accessToken;
  calTokenExpires = Date.now() + 50*60*1000;
  if(!calToken) throw new Error('no-token');
  return calToken;
}
// Mon–Thu window: on Fri/Sat/Sun it's next week; on Mon–Thu it's the current week.
function dinnerWeekWindow(){
  const now = new Date(); const dow = now.getDay(); // 0 Sun .. 6 Sat
  const offsetToMon = (dow===0) ? 1 : (dow>=5 ? 8-dow : 1-dow);
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate()+offsetToMon);
  const fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+4);
  return {mon, fri};
}
async function pullDinnersFromCalendar(){
  const token = await getCalendarToken();
  const {mon, fri} = dinnerWeekWindow();
  const url = 'https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(FAMILY_CALENDAR_ID)+'/events'+
    '?singleEvents=true&orderBy=startTime&maxResults=100'+
    '&timeMin='+encodeURIComponent(mon.toISOString())+'&timeMax='+encodeURIComponent(fri.toISOString());
  const res = await fetch(url, {headers:{Authorization:'Bearer '+token}});
  if(res.status===401){ calToken=null; throw new Error('expired'); }
  if(!res.ok) throw new Error('http-'+res.status);
  const data = await res.json();
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const lines = [];
  (data.items||[]).forEach(ev=>{
    const m = (ev.summary||'').match(/Dinner:\s*(.+)$/);
    if(!m) return;
    const start = new Date((ev.start && (ev.start.dateTime || ev.start.date)) || 0);
    lines.push(DAYS[start.getDay()]+': '+m[1].trim());
  });
  return lines;
}

function parsePicks(raw){
  const lines = (raw||'').split('\n').map(l=>l.trim()).filter(Boolean);
  return lines.map(line=>{
    let day='', name=line;
    const m = line.match(/^([A-Za-z]+)\s*:\s*(.+)$/);
    if(m){ day=m[1]; name=m[2].trim(); }
    const norm = foldApostrophes(name.toLowerCase());
    const all = Object.values(state.recipes);
    let match = all.find(r=>foldApostrophes(r.name.toLowerCase())===norm);
    if(!match) match = all.find(r=>{ const rn=foldApostrophes(r.name.toLowerCase()); return rn.includes(norm) || norm.includes(rn); });
    return {day, name, recipe: match||null};
  });
}

function deriveRecipeStaples(picks){
  const pool = new Map();
  const warnings = [];
  picks.forEach(p=>{
    if(!p.name) return;
    if(!p.recipe){ warnings.push('No recipe match for \u201c'+esc(p.name)+'\u201d'+(p.day?(' ('+esc(p.day)+')'):'')+' \u2014 check spelling, or add it in Recipes.'); return; }
    if(!p.recipe.ingredients || p.recipe.ingredients.length===0){ warnings.push('\u201c'+esc(p.recipe.name)+'\u201d has no ingredients logged yet \u2014 add them in Recipes.'); return; }
    p.recipe.ingredients.forEach(ing=>{
      if(ing.isStaple){
        const key = normalizeName(ing.name);
        if(!pool.has(key)) pool.set(key, {key, name:ing.name, qty:ing.qty, unit:ing.unit});
      }
    });
  });
  return {pool:[...pool.values()], warnings};
}

function computeWeekLists(){
  const week = state.week;
  const picks = parsePicks(week.picksRaw);
  const alexaParsed = (week.alexaRaw||'').split('\n').map(parseIngredientLine).filter(x=>x&&x.name);
  const staplesSelected = state.staples.filter(s=> week.staplesSelected && week.staplesSelected[s.id]);
  const manual = week.manualItems || [];

  const {warnings} = deriveRecipeStaples(picks);
  const recipeStaplesChecked = week.recipeStaplesChecked || {};
  const raw = [];
  picks.forEach(p=>{
    if(!p.name || !p.recipe || !p.recipe.ingredients || !p.recipe.ingredients.length) return;
    p.recipe.ingredients.forEach(ing=>{
      if(ing.isStaple){
        const key = normalizeName(ing.name);
        if(recipeStaplesChecked[key]) raw.push({name:ing.name, qty:ing.qty, unit:ing.unit, source:'recipe'});
      } else {
        raw.push({name:ing.name, qty:ing.qty, unit:ing.unit, source:'recipe'});
      }
    });
  });
  alexaParsed.forEach(a=> raw.push({name:a.name, qty:a.qty, unit:a.unit, source:'alexa'}));
  staplesSelected.forEach(s=> raw.push({name:s.name, qty:'', unit:'', source:'staple'}));
  manual.forEach(m=> raw.push({name:m.name, qty:m.qty, unit:m.unit, source:'manual'}));

  let defaultsChanged = false;
  const sortedRaw = [];
  raw.forEach(it=>{
    const key = normalizeName(it.name);
    if(!key) return;
    const dKey = defaultsKey(it.name);
    let d = state.defaults[dKey];
    if(!d || !d.store){
      // No default yet \u2014 silently assume Aldi with a guessed aisle. Editing is by exception (move to Woolworths, or fix the aisle) rather than a blocking prompt.
      d = {store:'aldi', aisle: (d&&d.aisle) || guessAisle(it.name)};
      state.defaults[dKey] = d;
      defaultsChanged = true;
    }
    sortedRaw.push({...it, store:d.store, aisle: d.aisle || guessAisle(it.name)});
  });
  if(defaultsChanged) saveDefaults();

  const combined = new Map();
  sortedRaw.forEach(it=>{
    const key = it.store+'|'+defaultsKey(it.name)+'|'+(it.unit||'');
    if(!combined.has(key)) combined.set(key, {key, name:displayName(it.name), unit:it.unit, store:it.store, aisle:it.aisle, qtyNums:[], qtyTexts:[]});
    const b = combined.get(key);
    if(it.qty){
      const n = parseFloat(String(it.qty).replace(',', '.'));
      if(!isNaN(n) && /^[\d.\s]+$/.test(String(it.qty).trim())) b.qtyNums.push(n);
      else b.qtyTexts.push(String(it.qty));
    }
  });

  const removedItems = week.removedItems || {};
  const qtyOverrides = week.qtyOverrides || {};
  const lists = {aldi:{}, woolworths:{}};
  AISLES.forEach(a=>{ lists.aldi[a]=[]; lists.woolworths[a]=[]; });
  combined.forEach(b=>{
    if(removedItems[b.key]) return;
    let qtyDisplay;
    if(qtyOverrides[b.key] !== undefined){
      qtyDisplay = qtyOverrides[b.key];
    } else {
      const parts = [];
      if(b.qtyNums.length){ const sum = b.qtyNums.reduce((a,c)=>a+c,0); parts.push(sum + (b.unit?(' '+b.unit):'')); }
      if(b.qtyTexts.length) parts.push(b.qtyTexts.join(' + ') + (b.unit && !b.qtyNums.length ? (' '+b.unit) : ''));
      qtyDisplay = parts.join(' + ');
    }
    const store = lists[b.store] ? b.store : 'aldi';
    const aisle = AISLES.includes(b.aisle) ? b.aisle : 'Other';
    lists[store][aisle].push({key:b.key, name:b.name, qty:qtyDisplay, checked: !!(week.shoppingChecked && week.shoppingChecked[b.key])});
  });
  Object.values(lists.aldi).forEach(arr=>arr.sort((a,c)=>a.name.localeCompare(c.name)));
  Object.values(lists.woolworths).forEach(arr=>arr.sort((a,c)=>a.name.localeCompare(c.name)));

  return {lists, warnings};
}

      (state.calStatus ? '<div class="warning-box"'+(state.calStatus.ok?' style="background:var(--wool-soft);border-color:var(--wool);"':'')+'>'+esc(state.calStatus.msg)+'</div>' : '')+
      '<button class="btn ghost" data-action="pull-calendar" style="margin-bottom:12px;">'+(state.calBusy?'Checking the family calendar\u2026':'\uD83D\uDCC5 Pull dinners from family calendar')+'</button>'+
      '<div class="card">'+
      '<div class="field"><label>This week\u2019s dinners (paste Monday\u2013Thursday from your Friday menu plan)</label>'+
      '<textarea data-field="picksRaw" placeholder="Mon: Slow Cooker Lemon Garlic Chicken\nTue: GF Beef & Broccoli Stir Fry\nWed: Pulled Pork\nThu: Mexican Fiesta">'+esc(wf.picksRaw)+'</textarea></div>'+
      '</div>'+
      '<button class="btn" data-action="wizard-next">Next: Check pantry needs \u2192</button>';
    return html;
  }

  if(wf.step===2){
    const picks = parsePicks(wf.picksRaw);
    const {pool, warnings} = deriveRecipeStaples(picks);
    if(warnings.length) html += '<div class="warning-box"><strong>Heads up</strong><ul>'+warnings.map(w=>'<li>'+w+'</li>').join('')+'</ul></div>';
    html += '<div class="card"><label class="muted" style="display:block;margin-bottom:8px;">This week\u2019s recipes use these pantry staples \u2014 tick any you\u2019re actually low on</label>';
    if(!pool.length){
      html += '<div class="empty-state">No pantry staples flagged in this week\u2019s recipes.</div>';
    } else {
      pool.forEach(s=>{
        html += '<div class="staple-row"><label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;">'+
          '<input type="checkbox" data-action="wizard-recipe-staple" data-key="'+esc(s.key)+'" '+(wf.recipeStaplesChecked[s.key]?'checked':'')+'>'+
          '<span class="staple-name">'+esc(s.name)+(s.qty?' <span class="item-qty">'+esc(s.qty+' '+(s.unit||''))+'</span>':'')+'</span>'+
        '</label></div>';
      });
    }
    html += '</div>'+
      '<div class="row"><button class="btn ghost" data-action="wizard-back">\u2190 Back</button>'+
      '<button class="btn" data-action="wizard-next">Next: Alexa list \u2192</button></div>';
    return html;
  }

  if(wf.step===3){
    html += '<div class="card">'+
      '<div class="field"><label>Alexa shopping list (paste items, one per line)</label>'+
      '<textarea data-field="alexaRaw" placeholder="Dog food\nBatteries\n2 avocados">'+esc(wf.alexaRaw)+'</textarea></div>'+
      '</div>'+
      '<div class="row"><button class="btn ghost" data-action="wizard-back">\u2190 Back</button>'+
      '<button class="btn" data-action="wizard-next">Next: Staples check \u2192</button></div>';
    return html;
  }

  // step 4
  html += '<div class="card">'+
    '<label class="muted" style="display:block;margin-bottom:8px;">Household staples \u2014 tick what\u2019s actually low</label>'+
    (state.staples.length===0 ? '<div class="empty-state">No staples set up yet \u2014 add some in the Staples tab.</div>' :
      '<div class="checklist">'+state.staples.map(s=>
        '<label><input type="checkbox" data-action="staple-check" data-id="'+s.id+'" '+(wf.staplesSelected[s.id]?'checked':'')+'> '+esc(s.name)+'</label>'
      ).join('')+'</div>')+
  '</div>'+
  '<div class="row"><button class="btn ghost" data-action="wizard-back">\u2190 Back</button>'+
  '<button class="btn" data-action="build-week">Build the lists \u2192</button></div>';
  return html;
}

// ----- Recipes -----
function computeIngredientClusters(){
  const map = new Map(); // lastWord -> Map(defaultsKey -> {key, name, recipes:Set})
  Object.values(state.recipes).forEach(r=>{
    (r.ingredients||[]).forEach(ing=>{
      const dKey = defaultsKey(ing.name);
      if(!dKey) return;
      const words = dKey.split(' ');
      const lastWord = words[words.length-1];
      if(!map.has(lastWord)) map.set(lastWord, new Map());
      const variants = map.get(lastWord);
      if(!variants.has(dKey)) variants.set(dKey, {key:dKey, name:dKey, recipes:new Set()});
      variants.get(dKey).recipes.add(r.name);
    });
  });
  const clusters = [];
  map.forEach((variants, lastWord)=>{
    if(variants.size>1) clusters.push({lastWord, variants:[...variants.values()].map(v=>({...v, recipes:[...v.recipes]}))});
  });
  clusters.sort((a,c)=>a.lastWord.localeCompare(c.lastWord));
  return clusters;
}

function renderReconcilePanel(){
  const clusters = computeIngredientClusters();
  let html = '<div class="progress-note">Ingredients grouped by their last word \u2014 possible duplicates written differently across recipes. Nothing changes until you rename one. Renaming a variant updates it everywhere it\u2019s used.</div>';
  html += '<button class="btn ghost small" style="margin-bottom:10px;" data-action="reconcile-close">\u2190 Back to recipes</button>';
  if(!clusters.length){
    html += '<div class="card"><div class="empty-state">No likely duplicates found across your recipes.</div></div>';
    return html;
  }
  clusters.forEach((c, ci)=>{
    html += '<div class="card"><div class="recipe-name" style="margin-bottom:8px;">\u201c'+esc(c.lastWord)+'\u201d</div>';
    c.variants.forEach((v, vi)=>{
      const inputId = 'reconcile-'+ci+'-'+vi;
      html += '<div class="ing-row">'+
        '<input type="text" id="'+inputId+'" value="'+esc(v.name)+'" class="ing-name">'+
        '<span class="muted" style="font-size:11px;flex:1 1 160px;">used in: '+esc(v.recipes.join(', '))+'</span>'+
        '<button class="btn ghost small" data-action="reconcile-rename" data-key="'+esc(v.key)+'" data-input="'+inputId+'">Rename everywhere \u2192</button>'+
      '</div>';
    });
    html += '</div>';
  });
  return html;
}

// ---------- events ----------
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.matches('textarea[data-field]')){
    state.weekForm[t.dataset.field] = t.value;
    saveWeekDraftDebounced();
  }
});

document.addEventListener('change', e=>{
  const t = e.target;
  const action = t.dataset.action;
  if(action==='staple-check'){
    state.weekForm.staplesSelected[t.dataset.id] = t.checked;
    saveWeekDraftDebounced();
  } else if(action==='toggle-ingredient-staple'){
    const ing = state.recipes[t.dataset.recipe].ingredients.find(i=>i.id===t.dataset.ing);
    if(ing){ ing.isStaple = t.checked; saveRecipe(t.dataset.recipe); render(); }
  } else if(action==='wizard-recipe-staple'){
    state.weekForm.recipeStaplesChecked[t.dataset.key] = t.checked;
    saveWeekDraftDebounced();
  } else if(action==='toggle-check'){
    if(!state.week.shoppingChecked) state.week.shoppingChecked = {};
    state.week.shoppingChecked[t.dataset.key] = t.checked;
    saveWeekField(['shoppingChecked', t.dataset.key], t.checked); render();
  } else if(action==='set-default-store'){
    updateDefault(t.dataset.name, t.value, null);
  } else if(action==='set-default-aisle'){
    updateDefault(t.dataset.name, null, t.value);
  }
});

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  if(a==='tab'){ state.tab = el.dataset.id; render(); }
  else if(a==='store-tab'){ state.storeTab = el.dataset.id; render(); }
  else if(a==='wizard-next'){ state.weekForm.step = Math.min(4, (state.weekForm.step||1)+1); saveWeekDraftNow(); render(); }
  else if(a==='pull-calendar'){
    if(state.calBusy) return;
    state.calBusy = true; state.calStatus = null; render();
    pullDinnersFromCalendar().then(lines=>{
      state.calBusy = false;
      if(!lines.length){
        state.calStatus = {ok:false, msg:'No \u201cDinner:\u201d events found on the family calendar for Mon\u2013Thu yet. Has the Friday menu plan been booked?'};
      } else {
        state.weekForm.picksRaw = lines.join('\n');
        state.weekForm.fromAutomation = false;
        state.calStatus = {ok:true, msg:'Pulled '+lines.length+' dinner'+(lines.length===1?'':'s')+' from the family calendar \u2014 check they look right, then continue.'};
        saveWeekDraftNow();
      }
      render();
    }).catch(err=>{
      state.calBusy = false;
      const code = err && (err.code||err.message) || '';
      state.calStatus = {ok:false, msg: code.indexOf('popup')>=0 ? 'Calendar access was cancelled \u2014 tap the button again to retry.' :
        (code==='http-403' ? 'Google Calendar refused the request \u2014 the Calendar API may not be enabled for this Firebase project yet.' :
         'Couldn\u2019t read the family calendar ('+code+'). Try again, or paste the dinners in below.')};
      render();
    });
  }
  else if(a==='wizard-back'){ state.weekForm.step = Math.max(1, (state.weekForm.step||1)-1); saveWeekDraftNow(); render(); }

  else if(a==='build-week'){
    const wf = state.weekForm;
    state.week = {
      picksRaw: wf.picksRaw, alexaRaw: wf.alexaRaw, staplesSelected: {...wf.staplesSelected},
      recipeStaplesChecked: {...wf.recipeStaplesChecked},
      manualItems: (state.week&&state.week.manualItems)||[],
      removedItems: (state.week&&state.week.removedItems)||{},
      qtyOverrides: (state.week&&state.week.qtyOverrides)||{},
      shoppingChecked: {}, builtAt: Date.now()
    };
    saveWeek(); deleteWeekDraft(); render();
  }
  else if(a==='edit-week'){
    state.weekForm = {
      picksRaw: state.week.picksRaw||'', alexaRaw: state.week.alexaRaw||'',
      staplesSelected: {...(state.week.staplesSelected||{})},
      recipeStaplesChecked: {...(state.week.recipeStaplesChecked||{})},
      step: 1
    };
    state.week.builtAt = null; saveWeek(); saveWeekDraftNow(); render();
  }
  else if(a==='new-week'){
    if(confirm('Start a new week? This clears this week\u2019s picks, Alexa list, and checked-off items.')){
      state.week = null; state.weekForm = {picksRaw:'', alexaRaw:'', staplesSelected:{}, recipeStaplesChecked:{}, step:1};
      deleteWeek(); deleteWeekDraft(); render();
    }
  }
  else if(a==='move-store'){
    updateDefault(el.dataset.name, el.dataset.store, el.dataset.aisle);
    render();
  }
  else if(a==='remove-item'){
    if(!state.week.removedItems) state.week.removedItems = {};
    state.week.removedItems[el.dataset.key] = true;
    saveWeek(); render();
  }
  else if(a==='edit-item'){
    state.editingItem = el.dataset.key; render();
  }
  else if(a==='cancel-item-edit'){
    state.editingItem = null; render();
  }
  else if(a==='save-item-edit'){
    const key = el.dataset.key, name = el.dataset.name;
    const newQty = document.getElementById('item-edit-qty').value.trim();
    const newAisle = document.getElementById('item-edit-aisle-select').value;
    if(!state.week.qtyOverrides) state.week.qtyOverrides = {};
    state.week.qtyOverrides[key] = newQty;
    updateDefault(name, null, newAisle);
    state.editingItem = null;
    saveWeek(); render();
  }
  else if(a==='add-manual'){
    const name = document.getElementById('manual-name').value.trim();
    if(!name) return;
    const qty = document.getElementById('manual-qty').value.trim();
    const unit = document.getElementById('manual-unit').value.trim();
    if(!state.week.manualItems) state.week.manualItems = [];
    state.week.manualItems.push({name, qty, unit});
    saveWeek(); render();
  }

  else if(a==='toggle-recipe'){
    state.expandedRecipe = state.expandedRecipe===el.dataset.id ? null : el.dataset.id;
    state.editingIngredient = null; render();
  }
  else if(a==='reconcile-open'){ state.recipesView = 'reconcile'; render(); }
  else if(a==='reconcile-close'){ state.recipesView = 'list'; render(); }
  else if(a==='reconcile-rename'){
    const input = document.getElementById(el.dataset.input);
    const newName = input.value.trim();
    if(!newName) return;
    const oldKey = el.dataset.key;
    Object.keys(state.recipes).forEach(rid=>{
      let changed = false;
      state.recipes[rid].ingredients.forEach(ing=>{
        if(defaultsKey(ing.name)===oldKey && ing.name!==newName){ ing.name = newName; changed = true; }
      });
      if(changed) saveRecipe(rid);
    });
    render();
  }
  else if(a==='add-ingredient'){
    const rid = el.dataset.recipe;
    const name = document.getElementById('new-ing-name').value.trim();
    if(!name) return;
    const qty = document.getElementById('new-ing-qty').value.trim();
    const unit = document.getElementById('new-ing-unit').value.trim();
    const isStaple = document.getElementById('new-ing-staple').checked;
    state.recipes[rid].ingredients.push({id:uid(), name, qty, unit, isStaple});
    saveRecipe(rid); render();
  }
  else if(a==='parse-paste'){
    const rid = el.dataset.recipe;
    const ta = document.getElementById('paste-'+rid);
    const lines = ta.value.split('\n').map(parseIngredientLine).filter(x=>x&&x.name);
    lines.forEach(l=> state.recipes[rid].ingredients.push({id:uid(), name:l.name, qty:l.qty, unit:l.unit}));
    saveRecipe(rid); render();
  }
  else if(a==='edit-ingredient'){
    state.editingIngredient = {recipeId:el.dataset.recipe, ingId:el.dataset.ing}; render();
  }
  else if(a==='cancel-edit-ingredient'){ state.editingIngredient = null; render(); }
  else if(a==='save-ingredient'){
    const rid = el.dataset.recipe, iid = el.dataset.ing;
    const r = state.recipes[rid];
    const ing = r.ingredients.find(i=>i.id===iid);
    ing.qty = document.getElementById('edit-qty').value.trim();
    ing.unit = document.getElementById('edit-unit').value.trim();
    ing.name = document.getElementById('edit-name').value.trim();
    ing.isStaple = document.getElementById('edit-staple').checked;
    state.editingIngredient = null;
    saveRecipe(rid); render();
  }
  else if(a==='remove-ingredient'){
    const rid = el.dataset.recipe, iid = el.dataset.ing;
    state.recipes[rid].ingredients = state.recipes[rid].ingredients.filter(i=>i.id!==iid);
    saveRecipe(rid); render();
  }

  else if(a==='add-staple'){
    const inp = document.getElementById('new-staple-name');
    const name = inp.value.trim();
    if(!name) return;
    state.staples.push({id:uid(), name});
    saveStaples(); render();
  }
  else if(a==='paste-staples'){
    const ta = document.getElementById('paste-staples');
    const have = new Set(state.staples.map(s=>normalizeName(s.name)));
    const lines = ta.value.split('\n').map(l=>l.replace(/^[-*\u2022\d.\)]+\s*/,'').trim()).filter(Boolean);
    let added = 0;
    lines.forEach(name=>{
      const key = normalizeName(name);
      if(key && !have.has(key)){ state.staples.push({id:uid(), name}); have.add(key); added++; }
    });
    if(added) saveStaples();
    render();
  }
  else if(a==='add-suggested-staples'){
    const checked = [...document.querySelectorAll('[data-suggest-staple]:checked')].map(cb=>cb.getAttribute('data-suggest-staple'));
    if(!checked.length) return;
    checked.forEach(name=> state.staples.push({id:uid(), name}));
    saveStaples(); render();
  }
  else if(a==='remove-staple'){
    state.staples = state.staples.filter(s=>s.id!==el.dataset.id);
    saveStaples(); render();
  }
});

// ---------- swipe-to-remove (This Week's built list only) ----------
// Swipe LEFT on an item removes it from THIS week's collated list only (matches the standard
// iOS Mail/Messages convention) \u2014 the recipe/ingredient itself is untouched, so it reappears
// normally if that recipe comes up again. A plain \u2715 button on each row does the same thing,
// as a guaranteed-reliable fallback regardless of how the gesture behaves on a given device.
let swipeState = null;
const SWIPE_THRESHOLD = 64;

document.addEventListener('pointerdown', e=>{
  const row = e.target.closest('.item-row[data-key]');
  if(!row) return;
  if(e.target.closest('input,select,button')) return; // let checkbox/pencil/move-link work normally
  swipeState = { row, key: row.dataset.key, startX: e.clientX, startY: e.clientY, dx:0, dragging:false, pointerId:e.pointerId };
}, {passive:false});

document.addEventListener('pointermove', e=>{
  if(!swipeState || e.pointerId !== swipeState.pointerId) return;
  const dx = e.clientX - swipeState.startX;
  const dy = e.clientY - swipeState.startY;
  if(!swipeState.dragging){
    if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){
      swipeState.dragging = true;
      try{ swipeState.row.setPointerCapture(swipeState.pointerId); }catch(e){}
    } else if(Math.abs(dy) > 10){
      swipeState = null; return; // vertical scroll \u2014 not a swipe, let the page scroll
    } else { return; }
  }
  // Once we've committed to a horizontal drag, stop the browser taking the gesture over
  // (iOS Safari will otherwise contest it as a scroll/navigation attempt and the row won't move).
  if(e.cancelable) e.preventDefault();
  swipeState.dx = Math.max(-100, Math.min(dx, 0)); // left-swipe only, clamped
  swipeState.row.style.transform = 'translateX('+swipeState.dx+'px)';
}, {passive:false});

function endSwipe(e){
  if(!swipeState || (e && e.pointerId !== swipeState.pointerId)) return;
  const { row, key, dx, dragging } = swipeState;
  if(dragging){
    if(dx < -SWIPE_THRESHOLD){
      row.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
      row.style.transform = 'translateX(-100%)';
      row.style.opacity = '0';
      setTimeout(()=>{
        if(!state.week.removedItems) state.week.removedItems = {};
        state.week.removedItems[key] = true;
        saveWeekField(['removedItems', key], true); render();
      }, 170);
    } else {
      row.style.transition = 'transform 0.15s ease';
      row.style.transform = 'translateX(0)';
      setTimeout(()=>{ row.style.transition=''; }, 160);
    }
  }
  swipeState = null;
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

if(firebaseAvailable){
  auth.onAuthStateChanged(user=>{
    if(user){ init(); }
    else { stopLiveSync(); renderSignIn(); }
  });
} else {
  db = makeLocalDb();
  init();
}
// Some mobile browsers auto-focus the first text field on load, popping the keyboard open
// before the user's touched anything. Explicitly un-focus shortly after the first render settles.
setTimeout(()=>{
  if(document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
}, 150);
</script>
